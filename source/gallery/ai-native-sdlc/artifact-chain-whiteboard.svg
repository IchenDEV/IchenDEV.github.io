<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">交接不能只靠聊天</title>
  <desc id="desc">白板手绘风格。餐厅订单从顾客、服务员、厨师、验菜员传到顾客，展示 Artifact 像接力单一样保存意图。</desc>
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter>
    <style>
      .ink{fill:none;stroke:#171717;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .txt{font-family:"Comic Sans MS","Marker Felt","PingFang SC","Microsoft YaHei",sans-serif;fill:#171717;font-weight:700}.small{font-size:28px}.mid{font-size:38px}.big{font-size:58px}
      .blue{fill:#2563eb}.green{fill:#16a34a}.orange{fill:#f97316}.red{fill:#dc2626}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <g filter="url(#rough)">
    <path class="ink" d="M456 30 Q790 7 1130 30 L1124 136 Q789 151 462 136Z" fill="#fff"/>
    <path class="thin orange" d="M480 78 l12 23 l27 4 l-20 18 l5 26 l-24-12 l-24 12 l5-26 l-20-18 l27-4Z" fill="#facc15"/>
    <text class="txt big" x="548" y="103">交接不能只靠</text><text class="txt big blue" x="924" y="103">聊天</text>

    <!-- customer -->
    <circle cx="115" cy="321" r="48" fill="#fff" stroke="#171717" stroke-width="7"/>
    <path class="ink" d="M75 306 q36-60 80-5"/>
    <path class="thin" d="M96 327 q9 9 18 0 M127 327 q9 9 18 0 M108 350 q15 12 30 0"/>
    <path class="ink" d="M64 382 q50-44 103 0 l18 130 H47Z" fill="#fff"/>
    <path class="ink" d="M64 414 q-34 5-52 37 M162 415 q40 6 54 35"/>
    <ellipse cx="119" cy="528" rx="95" ry="30" fill="#fff" stroke="#171717" stroke-width="6"/>
    <circle cx="85" cy="522" r="12" fill="#fff" stroke="#171717" stroke-width="4"/>
    <rect x="132" y="492" width="25" height="40" rx="5" fill="#fff" stroke="#171717" stroke-width="4"/>
    <path class="ink" d="M60 220 q63-48 124 0 q18 14 7 32 l-22 37 q-8 14-26 8 l-70 0 q-20 2-28-15 l-18-33 q-9-18 8-29Z"/>
    <ellipse cx="111" cy="251" rx="39" ry="13" fill="#fff" stroke="#171717" stroke-width="4"/>
    <path class="thin orange" d="M81 248 q29-23 60 0 M91 246 l10-10 M117 246 l10-11"/>
    <text class="txt mid blue" x="57" y="590">需求</text>

    <!-- waiter -->
    <circle cx="362" cy="315" r="48" fill="#fff" stroke="#171717" stroke-width="7"/>
    <path class="ink" d="M321 300 q37-55 82-2"/>
    <path class="thin" d="M344 321 q8 8 16 0 M375 321 q8 8 16 0 M351 345 q15 10 29 0"/>
    <path class="ink" d="M311 374 q50-42 102 0 l19 141 H292Z" fill="#fff"/>
    <path class="thin orange" d="M352 374 l10 15 l10-15 l11 15 l10-15"/>
    <rect x="385" y="393" width="87" height="127" rx="7" fill="#fff" stroke="#171717" stroke-width="6" transform="rotate(-5 428 456)"/>
    <path class="thin" d="M401 420 h51 M401 442 h43 M401 464 h49 M401 486 h38"/>
    <path class="ink" d="M311 407 q-49 15-69 51 M410 405 q34 5 49 28"/>
    <path class="thin blue" d="M313 250 l-22-18 M341 239 l-7-28 M402 250 l23-18"/>
