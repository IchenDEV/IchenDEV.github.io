    <circle cx="651" cy="319" r="54" fill="#fff" stroke="#171717" stroke-width="7"/>
    <path class="ink" d="M602 270 q0-50 35-47 q20-42 42 0 q38-2 36 48"/>
    <path class="thin" d="M630 329 q9 9 18 0 M663 329 q9 9 18 0 M639 354 q16 11 31 0"/>
    <path class="ink" d="M596 383 q55-46 111 0 l18 139 H577Z" fill="#fff"/>
    <ellipse cx="651" cy="520" rx="96" ry="30" fill="#fff" stroke="#171717" stroke-width="7"/>
    <circle cx="744" cy="365" r="54" fill="#fff" stroke="#171717" stroke-width="8"/>
    <path class="ink" d="M706 403 l-58 74"/>
    <path class="thin blue" d="M744 297 l0-31 M713 304 l-15-26 M776 304 l17-25"/>
    <path class="thin orange" d="M582 513 q67-39 137 0"/>
    <circle cx="618" cy="504" r="8" fill="#16a34a"/><circle cx="651" cy="517" r="8" fill="#f97316"/><circle cx="684" cy="504" r="8" fill="#16a34a"/>

