name: Publish redesigned AI-native SDLC article

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/regenerate-ai-native-sdlc.yml
      - tools/.ai-native-sdlc-article.md.gz.b64
      - tools/.ai-native-sdlc-images.py.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-comic-neue
          python -m pip install --upgrade pillow
          fc-cache -f

      - name: Restore article and image generator
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/.ai-native-sdlc-article.md.gz.b64 | gzip -dc > source/_posts/ai-native-sdlc-running-system.md
          base64 -d tools/.ai-native-sdlc-images.py.gz.b64 | gzip -dc > tools/generate-ai-native-sdlc-images.py
          printf '%s  %s\n' '27b4f9af068a4cef60ba4aee663fe0b31b4822850402013a61a0716433c92bd7' 'source/_posts/ai-native-sdlc-running-system.md' | sha256sum --check
          printf '%s  %s\n' 'ea71cce3251379d7dbd1d4dffe65942abc4b5534fbf1bf9a2fe3ba80d2926baf' 'tools/generate-ai-native-sdlc-images.py' | sha256sum --check

      - name: Generate the five illustrations
        env:
          PYTHONUTF8: '1'
        run: python tools/generate-ai-native-sdlc-images.py

      - name: Validate article and images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          article = Path('source/_posts/ai-native-sdlc-running-system.md').read_text(encoding='utf-8')
          required = [
              '/gallery/ai-native-sdlc/cover.png',
              '/gallery/ai-native-sdlc/artifact-chain.png',
              '/gallery/ai-native-sdlc/control-stack.png',
              '/gallery/ai-native-sdlc/feedback-evals.png',
              '/gallery/ai-native-sdlc/personal-harness.png',
          ]
          for item in required:
              if item not in article:
                  raise SystemExit(f'missing article image reference: {item}')

          forbidden = ['不是', '而是', '—', '–', '如果你想', '下一步']
          for phrase in forbidden:
              if phrase in article:
                  raise SystemExit(f'forbidden phrase remains: {phrase}')

          image_dir = Path('source/gallery/ai-native-sdlc')
          names = ['cover.png', 'artifact-chain.png', 'control-stack.png', 'feedback-evals.png', 'personal-harness.png']
          for name in names:
              path = image_dir / name
              if not path.exists():
                  raise SystemExit(f'missing image: {path}')
              if path.stat().st_size > 500 * 1024:
                  raise SystemExit(f'image exceeds 500KB: {path}')
              with Image.open(path) as image:
                  if image.size != (1600, 900):
                      raise SystemExit(f'unexpected dimensions for {path}: {image.size}')
          PY

      - name: Remove one-time publishing files
        shell: bash
        run: |
          set -euo pipefail
          rm tools/.ai-native-sdlc-article.md.gz.b64
          rm tools/.ai-native-sdlc-images.py.gz.b64
          rm tools/generate-ai-native-sdlc-images.py
          rm .github/workflows/regenerate-ai-native-sdlc.yml

      - name: Commit redesigned article and illustrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'revise AI-native SDLC article and illustrations'
          git push origin HEAD:main
