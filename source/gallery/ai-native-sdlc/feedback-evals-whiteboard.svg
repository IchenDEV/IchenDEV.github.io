    <text class="txt mid blue" x="1271" y="585">复查</text>
    <circle cx="1360" cy="665" r="50" fill="#fff" stroke="#171717" stroke-width="7"/>
    <path class="ink" d="M1318 650 q40-48 82 0 M1327 633 q32-23 65 0"/>
    <path class="thin" d="M1341 672 q8 8 16 0 M1372 672 q8 8 16 0 M1349 696 q15 10 29 0"/>
    <path class="ink" d="M1308 724 q52-42 104 0 l15 112 H1293Z" fill="#fff"/>
    <rect x="1230" y="697" width="90" height="123" rx="8" fill="#fff" stroke="#171717" stroke-width="6" transform="rotate(-6 1275 758)"/>
