    <path class="thin green" d="M1437 624 q17-27 35 0 q-18 30-35 0Z" fill="#16a34a"/>
    <path class="ink" d="M1184 549 q155 15 207 66"/>
    <path class="ink" d="M1390 611 q86-127 33-278"/>

    <!-- wrong-answer notebook -->
    <rect x="588" y="625" width="248" height="217" rx="16" fill="#fff" stroke="#171717" stroke-width="7"/>
    <path class="thin" d="M620 625 v217 M651 625 v217"/>
    <path class="thin" d="M603 642 h61 M603 675 h61 M603 708 h61 M603 741 h61 M603 774 h61 M603 807 h61"/>
