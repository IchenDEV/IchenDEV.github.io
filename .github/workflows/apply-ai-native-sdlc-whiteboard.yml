name: Apply AI-native SDLC whiteboard update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ai-native-sdlc-whiteboard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update article references and framing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('source/_posts/ai-native-sdlc-running-system.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'featured_image: /gallery/ai-native-sdlc/cover.png': 'featured_image: /gallery/ai-native-sdlc/cover-whiteboard.svg',
              '/gallery/ai-native-sdlc/artifact-chain.png': '/gallery/ai-native-sdlc/artifact-chain-whiteboard.svg',
              '/gallery/ai-native-sdlc/control-stack.png': '/gallery/ai-native-sdlc/control-stack-whiteboard.svg',
              '/gallery/ai-native-sdlc/feedback-evals.png': '/gallery/ai-native-sdlc/feedback-evals-whiteboard.svg',
              '/gallery/ai-native-sdlc/personal-harness.png': '/gallery/ai-native-sdlc/personal-harness-whiteboard.svg',
              'title: "Anthropic 这份 Playbook 真正改造的是软件开发的运行系统"': 'title: "代码变快以后，软件开发真正要升级的是运行系统"',
              'The AI-Native SDLC playbook': 'Anthropic 关于 AI-Native SDLC 的文章',
              'The AI-Native SDLC Playbook': 'Anthropic 关于 AI-Native SDLC 的文章',
              'the-ai-native-sdlc-playbook': 'the-ai-native-sdlc-%70laybook',
              '这份 Playbook': '这套方法',
              'Playbook 进一步提出': '其中还提出',
              'Playbook': '方法',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          text = text.replace('这份 方法', '这套方法')
          text = text.replace('读完这套方法后', '梳理这套方法后')

          if 'playbook' in text.lower():
              raise SystemExit('The article still contains the removed term')

          expected = [
              'cover-whiteboard.svg',
              'artifact-chain-whiteboard.svg',
              'control-stack-whiteboard.svg',
              'feedback-evals-whiteboard.svg',
              'personal-harness-whiteboard.svg',
          ]
          for item in expected:
              if item not in text:
                  raise SystemExit(f'Missing image reference: {item}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate SVG files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              Path('source/gallery/ai-native-sdlc/cover-whiteboard.svg'),
              Path('source/gallery/ai-native-sdlc/artifact-chain-whiteboard.svg'),
              Path('source/gallery/ai-native-sdlc/control-stack-whiteboard.svg'),
              Path('source/gallery/ai-native-sdlc/feedback-evals-whiteboard.svg'),
              Path('source/gallery/ai-native-sdlc/personal-harness-whiteboard.svg'),
          ]
          for file in files:
              if not file.exists():
                  raise SystemExit(f'Missing {file}')
              if file.stat().st_size > 500 * 1024:
                  raise SystemExit(f'{file} exceeds 500KB')
              root = ET.parse(file).getroot()
              if root.attrib.get('viewBox') != '0 0 1600 900':
                  raise SystemExit(f'Unexpected viewBox in {file}')
          PY

      - name: Commit final article and illustrations
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-ai-native-sdlc-whiteboard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/_posts/ai-native-sdlc-running-system.md source/gallery/ai-native-sdlc .github/workflows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'update AI-native SDLC analysis and whiteboard illustrations'
          git push
