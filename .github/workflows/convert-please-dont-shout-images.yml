name: Convert please-dont-shout images to PNG

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/convert-please-dont-shout-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image converters
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick fonts-comic-neue

      - name: Convert SVG assets and update article references
        shell: bash
        run: |
          set -euo pipefail

          image_dir="source/gallery/please-dont-shout"
          article="source/_posts/please-dont-shout.md"

          shopt -s nullglob
          svg_files=("$image_dir"/*.svg)
          if [ "${#svg_files[@]}" -eq 0 ]; then
            echo "No SVG files found in $image_dir"
            exit 1
          fi

          for source_file in "${svg_files[@]}"; do
            output_file="${source_file%.svg}.png"
            rsvg-convert --format=png --keep-aspect-ratio --output "$output_file" "$source_file"
            convert "$output_file" \
              -colorspace Gray \
              -threshold 88% \
              -type bilevel \
              -define png:color-type=0 \
              -define png:bit-depth=1 \
              -strip \
              "$output_file"
          done

          sed -i 's/\.svg/\.png/g' "$article"

          if grep -n '\.svg' "$article"; then
            echo "The article still contains SVG references."
            exit 1
          fi

          git rm "$image_dir"/*.svg
          git rm .github/workflows/convert-please-dont-shout-images.yml

      - name: Commit converted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/_posts/please-dont-shout.md source/gallery/please-dont-shout
          git commit -m "fix: replace SVG blog assets with PNG"
          git push origin HEAD:main
