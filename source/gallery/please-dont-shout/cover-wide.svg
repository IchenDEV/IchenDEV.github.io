<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Please don't shout</title>
  <desc id="desc">A tired reader surrounded by loud online posts and megaphones.</desc>
  <defs>
    <style>
      .ink{fill:none;stroke:#111;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .paper{fill:#fff;stroke:#111;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .txt{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:34px}
      .small{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:27px}
      .caption{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:76px}
    </style>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <g id="megaphone">
      <path class="paper" d="M0 18 L52 2 L52 50 L0 34 Z"/>
      <path class="ink" d="M0 18 Q-17 17 -17 26 Q-17 35 0 34"/>
      <path class="ink" d="M15 36 L22 61 L38 56 L30 33"/>
      <path class="thin" d="M64 7 L82-3 M67 27 L89 27 M64 47 L82 57"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <g filter="url(#rough)">
    <g transform="translate(86 145) rotate(-4)">
      <rect class="paper" width="310" height="185" rx="14"/>
      <path class="ink" d="M52 43 l10 21 23 3-17 15 5 23-21-12-22 12 6-23-18-15 24-3z"/>
      <text class="txt" x="102" y="61">OMG!!!</text>
      <text class="small" x="65" y="112">You won't believe this</text>
      <text class="small" x="65" y="148">Game changing!</text>
    </g>
    <g transform="translate(120 390) rotate(3)">
      <rect class="paper" width="330" height="165" rx="14"/>
      <use href="#megaphone" transform="translate(32 48) scale(.8)"/>
      <text class="txt" x="135" y="66">Listen to me</text>
      <text class="small" x="135" y="111">Don't scroll past this</text>
    </g>
    <g transform="translate(245 70)">
      <path class="paper" d="M0 18 Q0 0 22 0 H245 Q268 0 268 22 V58 Q268 80 245 80 H104 L80 108 L78 80 H22 Q0 80 0 58 Z"/>
      <text class="txt" x="34" y="52">Who knows?</text>
    </g>

    <g transform="translate(1200 125) rotate(4)">
      <rect class="paper" width="300" height="180" rx="14"/>
      <text class="txt" x="38" y="57">I really...</text>
      <circle class="thin" cx="150" cy="110" r="28"/>
      <path class="thin" d="M113 165 Q150 125 188 165 M135 108 q14 11 29 0 M130 137 q20 15 40 0"/>
    </g>
    <g transform="translate(1150 370) rotate(-3)">
      <rect class="paper" width="345" height="180" rx="14"/>
      <text class="txt" x="42" y="59">Unpopular opinion</text>
      <text class="small" x="42" y="108">You need to see this</text>
      <text class="caption" x="270" y="155">!</text>
    </g>
    <g transform="translate(1285 55)">
      <path class="paper" d="M15 35 L42 24 38 0 64 14 80-8 94 18 121 7 120 35 149 38 130 59 146 82 117 85 113 112 89 96 69 118 57 91 29 100 35 72 7 61 Z"/>
      <text class="small" x="47" y="66">Wake up!</text>
    </g>
    <use href="#megaphone" transform="translate(1470 315) rotate(8)"/>
    <use href="#megaphone" transform="translate(45 580) scale(.8) rotate(-10)"/>

    <g>
      <circle class="paper" cx="800" cy="384" r="78"/>
      <path class="thin" d="M773 369 q12-11 24 0 M818 369 q12-11 24 0 M783 415 q18-13 36 0"/>
      <path class="paper" d="M700 605 Q695 475 751 449 Q800 493 850 449 Q909 482 900 605 Z"/>
      <path class="ink" d="M742 481 Q690 510 678 574 M678 574 Q660 594 643 576 M858 485 Q890 528 888 584"/>
      <path class="ink" d="M643 576 Q633 548 643 520 Q653 498 671 482"/>
      <path class="thin" d="M742 295 q17-27 34 0 q16-33 35 0 q17-28 36 0"/>
    </g>

    <path class="ink" d="M560 626 H1045"/>
    <path class="ink" d="M600 626 V710 M1005 626 V710"/>
    <g transform="translate(690 565)">
      <path class="paper" d="M0 0 Q55-20 110 3 V60 Q55 39 0 59 Z"/>
      <path class="paper" d="M110 3 Q165-20 220 0 V59 Q165 39 110 60 Z"/>
      <line class="thin" x1="110" y1="5" x2="110" y2="60"/>
      <line class="thin" x1="24" y1="21" x2="83" y2="17"/>
      <line class="thin" x1="139" y1="18" x2="196" y2="23"/>
    </g>
    <g transform="translate(585 550)">
      <path class="paper" d="M0 0 H52 V76 H0 Z"/>
      <path class="ink" d="M52 17 q31 0 29 22 q-2 23-29 20"/>
    </g>
    <g transform="translate(955 548)">
      <rect class="paper" width="45" height="78" rx="4"/>
      <path class="thin" d="M12 0 L6-43 M24 0 L30-51 M36 0 L50-37"/>
    </g>

    <path class="thin" stroke-dasharray="11 14" d="M420 288 Q585 322 690 357 M1186 290 Q1020 320 910 360 M450 476 Q580 455 680 437 M1150 475 Q1022 455 920 438"/>
    <text class="caption" x="484" y="820">Please don't shout</text>
    <path class="ink" d="M590 846 Q800 873 1010 846"/>
  </g>
</svg>
