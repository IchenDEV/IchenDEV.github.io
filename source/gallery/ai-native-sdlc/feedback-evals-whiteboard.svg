    <path class="ink" d="M183 270 q0-50 35-47 q20-42 42 0 q38-2 36 48"/>
    <path class="thin" d="M211 329 q9 9 18 0 M244 329 q9 9 18 0 M220 354 q16 11 31 0"/>
    <path class="ink" d="M177 383 q55-46 111 0 l18 139 H158Z" fill="#fff"/>
    <path class="ink" d="M183 416 q-45 9-72 61 M283 417 q37 11 59 45"/>
    <ellipse cx="235" cy="520" rx="96" ry="30" fill="#fff" stroke="#171717" stroke-width="7"/>
    <path class="thin orange" d="M166 513 q67-39 137 0"/>
    <circle cx="202" cy="504" r="8" fill="#16a34a"/><circle cx="235" cy="517" r="8" fill="#f97316"/><circle cx="267" cy="504" r="8" fill="#16a34a"/>
    <path class="thin orange" d="M130 477 q-15-42 0-73 M144 479 q-11-34 3-61"/>
    <path class="thin" d="M124 481 q30 32 63 0"/>
    <path class="thin blue" d="M143 286 l-26-16 M163 259 l-12-29"/>

