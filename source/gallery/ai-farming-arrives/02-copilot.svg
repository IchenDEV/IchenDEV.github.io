<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="29" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.7"/></filter>
    <style>.ink{fill:none;stroke:#222;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#333;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.blue{fill:none;stroke:#1469d8;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.green{fill:none;stroke:#158650;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.orange{fill:none;stroke:#f07b20;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.txt{font-family:KaiTi,STKaiti,'Noto Sans SC',sans-serif;fill:#222}.big{font-size:66px;font-weight:700}.mid{font-size:43px;font-weight:700}.note{font-size:30px}</style>
  </defs>
  <rect width="1600" height="900" fill="#fbfaf6"/>
