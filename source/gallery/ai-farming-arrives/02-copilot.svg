    <path d="M704 337 C717 286 780 276 813 324" class="ink"/>
    <circle cx="724" cy="367" r="16" fill="none" stroke="#222" stroke-width="4"/><circle cx="768" cy="367" r="16" fill="none" stroke="#222" stroke-width="4"/><path d="M740 367 h12 M743 404 q18 10 34 -2" class="thin"/>
    <path d="M704 427 C666 472 660 554 672 644 M788 426 C830 474 835 557 820 646" class="ink"/>
    <path d="M681 451 C723 474 773 473 808 450" class="green"/><text x="704" y="516" class="txt note" fill="#158650">农艺师</text>
