<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">If every word is loud, nothing is</title><desc id="desc">A calm paragraph contrasted with a chaotic block where every word is emphasized.</desc><defs><style>.ink{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.paper{fill:#fff;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.txt{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:28px}.small{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:22px}.loud{fill:#111;font-family:Arial,sans-serif;font-size:26px;font-weight:700}.caption{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:54px}</style><filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.7"/></filter></defs><rect width="1200" height="900" fill="#fff"/><g filter="url(#rough)"><g transform="translate(105 130)"><rect class="paper" width="420" height="505" rx="8"/><path class="ink" d="M0 52 H420"/><circle class="thin" cx="25" cy="26" r="5"/><circle class="thin" cx="47" cy="26" r="5"/><circle class="thin" cx="69" cy="26" r="5"/><text class="txt" x="46" y="120">Good writing is not</text><text class="txt" x="46" y="165">about being loud.</text><text class="txt" x="46" y="220">It's about being clear,</text><line class="thin" x1="296" y1="228" x2="355" y2="228"/><text class="txt" x="46" y="275">useful, and respectful</text><text class="txt" x="46" y="320">of the reader's time.</text><text class="txt" x="46" y="385">Save the spotlight</text><text class="txt" x="46" y="430">for what matters.</text></g><g transform="translate(170 48)"><path class="paper" d="M0 20 Q0 0 22 0 H176 Q198 0 198 20 V52 Q198 72 176 72 H22 Q0 72 0 52 Z"/><text class="txt" x="28" y="46">Easy to read</text><path class="thin" d="M97 77 c-13-14-30 5 0 25 c30-20 13-39 0-25"/></g><g transform="translate(665 132)"><rect class="paper" width="430" height="505" rx="8"/><g transform="translate(25 38)"><rect class="paper" width="94" height="48"/><text class="loud" x="14" y="34">THIS</text><path class="paper" d="M112 24 l14-18 20 10 14-16 15 17 22-10 5 21 22 3-10 19 15 17-21 7-1 23-22-5-14 17-17-15-21 8-7-21-22-4 11-19z"/><text class="loud" x="132" y="42">AMAZING</text><rect class="paper" x="304" width="99" height="48"/><text class="loud" x="317" y="34">GUIDE</text><rect class="paper" y="75" width="97" height="48"/><text class="loud" x="16" y="109">WILL</text><rect class="paper" x="121" y="75" width="126" height="48"/><text class="loud" x="133" y="109">TOTALLY</text><rect class="paper" x="269" y="75" width="134" height="48"/><text class="loud" x="281" y="109">CHANGE</text><rect class="paper" y="150" width="105" height="48"/><text class="loud" x="13" y="184">YOUR</text><path class="paper" d="M124 173 l14-18 20 9 14-15 15 16 22-9 5 20 22 4-11 18 15 18-21 6-1 23-21-5-15 17-16-15-21 8-7-21-22-4 11-19z"/><text class="loud" x="151" y="191">LIFE</text><rect class="paper" x="260" y="150" width="143" height="48"/><text class="loud" x="273" y="184">FOREVER!</text><path class="paper" d="M0 265 l13-17 19 8 13-14 15 15 20-8 5 19 20 3-10 18 14 16-20 6-1 21-19-5-14 16-15-14-20 7-6-19-20-4 10-17z"/><text class="loud" x="14" y="291">YOU</text><rect class="paper" x="112" y="245" width="105" height="48"/><text class="loud" x="125" y="279">NEED</text><circle class="paper" cx="257" cy="269" r="29"/><text class="loud" x="238" y="278">TO</text><rect class="paper" x="300" y="245" width="103" height="48"/><text class="loud" x="319" y="279">SEE</text><rect class="paper" y="326" width="105" height="48"/><text class="loud" x="11" y="360">THIS</text><rect class="paper" x="127" y="326" width="108" height="48"/><text class="loud" x="140" y="360">RIGHT</text><path class="paper" d="M252 350 l13-17 19 8 13-14 15 15 20-8 5 19 20 3-10 18 14 16-20 6-1 21-19-5-14 16-15-14-20 7-6-19-20-4 10-17z"/><text class="loud" x="271" y="369">NOW</text><rect class="paper" y="407" width="111" height="48"/><text class="loud" x="11" y="441">DON'T</text><rect class="paper" x="132" y="407" width="105" height="48"/><text class="loud" x="146" y="441">MISS</text><rect class="paper" x="260" y="407" width="102" height="48"/><text class="loud" x="276" y="441">OUT</text><text class="caption" x="375" y="450">!</text></g></g><g transform="translate(795 40)"><path class="paper" d="M10 30 L34 20 30 0 52 12 65-7 78 15 101 5 101 30 125 33 109 51 123 70 99 73 95 96 75 83 58 102 48 78 24 86 29 62 5 52 Z"/><text class="txt" x="35" y="56">Too much!</text><path class="ink" d="M-40 32 l-15 18 19 7-13 19 M150 33 l16 18-19 7 14 19"/></g><g transform="translate(560 560)"><circle class="paper" cx="0" cy="0" r="50"/><path class="thin" d="M-18 -8 q8-8 16 0 M7 -8 q8-8 16 0 M-12 22 q12-10 25 0"/><path class="ink" d="M-36 34 q-35 18-24 68 M35 34 q35 18 24 68 M-60 102 q13 24 28 0 M59 102 q-13 24-28 0"/><path class="thin" d="M-17 -70 q12-20 24 0 q12-20 24 0"/></g><path class="ink" d="M65 680 H1135"/><text class="caption" x="176" y="800">If every word is loud, nothing is</text><path class="ink" d="M430 824 Q600 848 770 824"/></g></svg>