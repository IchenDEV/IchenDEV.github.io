    <circle cx="1075" cy="319" r="54" fill="#fff" stroke="#171717" stroke-width="7"/>
    <path class="ink" d="M1026 270 q0-50 35-47 q20-42 42 0 q38-2 36 48"/>
    <path class="thin" d="M1054 329 q9 9 18 0 M1087 329 q9 9 18 0 M1063 354 q16 11 31 0"/>
    <path class="ink" d="M1020 383 q55-46 111 0 l18 139 H1001Z" fill="#fff"/>
    <ellipse cx="1075" cy="520" rx="96" ry="30" fill="#fff" stroke="#171717" stroke-width="7"/>
    <path class="ink" d="M1126 412 q39-18 70 7"/>
    <rect x="1178" y="385" width="48" height="82" rx="11" fill="#fff" stroke="#171717" stroke-width="6" transform="rotate(15 1202 426)"/>
