name: Publish AI-native SDLC article

on:
  push:
    branches:
      - main
    paths:
      - ".github/ai-native-sdlc-payload/**"
      - ".github/workflows/publish-ai-native-sdlc.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install illustration renderers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick fontconfig curl
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/patrickhand/PatrickHand-Regular.ttf" \
            -o "$HOME/.local/share/fonts/PatrickHand-Regular.ttf" || true
          fc-cache -f || true

      - name: Restore article and five illustrations
        shell: bash
        run: |
          set -euo pipefail
          payload=".github/ai-native-sdlc-payload"
          article="source/_posts/ai-native-sdlc-running-system.md"
          gallery="source/gallery/ai-native-sdlc"

          mkdir -p "$(dirname "$article")" "$gallery" /tmp/ai-native-sdlc

          cat "$payload/article.part00" \
              "$payload/article.part01" \
              "$payload/article.part02" \
            | base64 --decode \
            | gzip --decompress \
            > "$article"

          mv "$payload/cover.png" "$gallery/cover.png"
          mv "$payload/artifact-chain.png" "$gallery/artifact-chain.png"
          mv "$payload/control-stack.png" "$gallery/control-stack.png"

          render_svg() {
            local name="$1"
            base64 --decode < "$payload/${name}.svg.gz.b64" \
              | gzip --decompress \
              > "/tmp/ai-native-sdlc/${name}.svg"

            python3 - "$name" <<'PY'
          from pathlib import Path
          import sys

          name = sys.argv[1]
          path = Path(f"/tmp/ai-native-sdlc/{name}.svg")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '"Marker Felt","Comic Sans MS","Bradley Hand",Arial,sans-serif',
              '"Patrick Hand","DejaVu Sans",sans-serif',
          )
          path.write_text(text, encoding="utf-8")
          PY

            rsvg-convert \
              --width 1200 \
              --height 900 \
              --output "/tmp/ai-native-sdlc/${name}.raw.png" \
              "/tmp/ai-native-sdlc/${name}.svg"

            convert "/tmp/ai-native-sdlc/${name}.raw.png" \
              -colorspace Gray \
              -threshold 88% \
              -type bilevel \
              -define png:color-type=0 \
              -define png:bit-depth=1 \
              -strip \
              "$gallery/${name}.png"
          }

          render_svg "feedback-evals"
          render_svg "personal-harness"

          test "$(wc -c < "$article")" -eq 43406
          test "$(identify -format '%wx%h' "$gallery/cover.png")" = "1600x900"
          for image in artifact-chain control-stack feedback-evals personal-harness; do
            test "$(identify -format '%wx%h' "$gallery/${image}.png")" = "1200x900"
          done
          for image in cover artifact-chain control-stack feedback-evals personal-harness; do
            test "$(wc -c < "$gallery/${image}.png")" -lt 512000
          done

      - name: Build the Hexo site
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check:images
          npm run clean
          npm run build

      - name: Commit the publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            source/_posts/ai-native-sdlc-running-system.md \
            source/gallery/ai-native-sdlc/cover.png \
            source/gallery/ai-native-sdlc/artifact-chain.png \
            source/gallery/ai-native-sdlc/control-stack.png \
            source/gallery/ai-native-sdlc/feedback-evals.png \
            source/gallery/ai-native-sdlc/personal-harness.png
          git rm -r .github/ai-native-sdlc-payload
          git commit -m "feat: publish AI-native SDLC operating system essay"
          git push
