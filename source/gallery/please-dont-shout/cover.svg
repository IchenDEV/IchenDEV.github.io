<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Please don't shout</title><desc id="desc">A tired reader surrounded by loud online posts and megaphones.</desc><defs><style>.ink{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#111;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.paper{fill:#fff;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.txt{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:28px}.small{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:21px}.caption{fill:#111;font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:62px}</style><filter id="rough" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="1" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.7"/></filter><g id="megaphone"><path class="paper" d="M0 17 L43 3 L43 45 L0 31 Z"/><path class="ink" d="M0 17 Q-14 16 -14 24 Q-14 32 0 31"/><path class="ink" d="M12 33 L18 53 L31 49 L25 30"/><path class="thin" d="M52 8 L66 0 M55 23 L73 23 M52 39 L66 47"/></g></defs><rect width="1200" height="900" fill="#fff"/><g filter="url(#rough)"><g transform="translate(80 185) rotate(-5)"><rect class="paper" x="0" y="0" width="175" height="365" rx="24"/><line class="thin" x1="55" y1="20" x2="120" y2="20"/><use href="#megaphone" transform="translate(62 125) scale(.9)"/></g><g transform="translate(210 118) rotate(-3)"><rect class="paper" width="250" height="150" rx="8"/><path class="ink" d="M38 32 l9 18 20 2-15 13 5 20-19-10-18 10 4-20-15-13 21-2z"/><text class="txt" x="82" y="42">OMG!!!</text><text class="small" x="80" y="77">You won't</text><text class="small" x="80" y="106">believe this!!!</text><circle class="thin" cx="32" cy="126" r="10"/><path class="thin" d="M29 120 l8 6-8 6z"/><line class="thin" x1="55" y1="125" x2="155" y2="125"/></g><g transform="translate(185 330) rotate(2)"><rect class="paper" width="250" height="138" rx="8"/><text class="txt" x="24" y="42">Game changing!</text><path class="thin" d="M38 78 l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z"/><circle class="thin" cx="150" cy="90" r="15"/><path class="thin" d="M137 113 q13 12 26 0 M135 88 l-16-12 M165 88 l17-12"/><line class="thin" x1="24" y1="116" x2="104" y2="116"/></g><g transform="translate(145 505) rotate(-4)"><rect class="paper" width="245" height="126" rx="8"/><path class="ink" d="M45 88 C22 70 32 50 44 35 C45 54 60 50 58 30 C80 50 76 77 58 91 Z"/><text class="small" x="84" y="48">Hot take</text><text class="small" x="84" y="80">Alert!!!</text><line class="thin" x1="88" y1="101" x2="175" y2="101"/></g><g transform="translate(185 70)"><path class="paper" d="M0 20 Q0 0 22 0 H215 Q238 0 238 22 V52 Q238 72 214 72 H83 L62 94 L61 72 H22 Q0 72 0 51 Z"/><text class="txt" x="28" y="46">Listen to me</text></g><g transform="translate(438 142)"><path class="paper" d="M0 18 Q0 0 20 0 H184 Q204 0 204 20 V53 Q204 72 183 72 H110 L92 93 L88 72 H20 Q0 72 0 52 Z"/><text class="txt" x="28" y="45">Who knows?</text></g><g transform="translate(677 94) rotate(4)"><rect class="paper" width="205" height="166" rx="8"/><text class="txt" x="31" y="45">I really...</text><circle class="thin" cx="102" cy="91" r="22"/><path class="thin" d="M75 145 Q102 111 130 145 M93 89 q9 8 18 0 M87 119 q15 11 30 0"/><path class="thin" d="M161 126 c-13-14-30 5 0 25 c30-20 13-39 0-25"/></g><g transform="translate(865 86)"><path class="paper" d="M15 33 L38 23 34 0 58 13 73-7 86 17 111 7 110 33 137 36 119 55 135 76 108 79 104 104 82 90 64 111 53 85 27 94 32 67 6 57 Z"/><text class="txt" x="38" y="58">Wake up!!!</text></g><g transform="translate(830 250) rotate(3)"><rect class="paper" width="248" height="150" rx="8"/><text class="small" x="28" y="42">This will</text><text class="small" x="28" y="72">blow your mind</text><path class="thin" d="M55 104 c-20-12-28 18-7 24 c-1 20 28 20 31 3 c18 7 31-18 12-28 c3-18-24-22-30-6 c-13-10-29 1-23 14"/><line class="thin" x1="118" y1="110" x2="210" y2="110"/><line class="thin" x1="118" y1="127" x2="195" y2="127"/></g><g transform="translate(730 420) rotate(-2)"><rect class="paper" width="280" height="150" rx="8"/><text class="txt" x="30" y="49">Unpopular</text><text class="txt" x="30" y="87">Opinion</text><text class="caption" x="223" y="95">!</text><line class="thin" x1="30" y1="119" x2="185" y2="119"/></g><g transform="translate(955 398)"><path class="paper" d="M0 20 Q0 0 20 0 H190 Q210 0 210 20 V65 Q210 85 190 85 H102 L82 108 L78 85 H20 Q0 85 0 65 Z"/><text class="small" x="28" y="38">You need</text><text class="small" x="28" y="67">to see this</text></g><use href="#megaphone" transform="translate(1055 160) scale(1.05) rotate(7)"/><use href="#megaphone" transform="translate(1045 555) scale(.8) rotate(-7)"/><use href="#megaphone" transform="translate(55 640) scale(.72) rotate(-12)"/><g><circle class="paper" cx="598" cy="465" r="58"/><path class="thin" d="M579 454 q8-8 17 0 M614 454 q8-8 17 0 M586 486 q13-9 27 0"/><path class="paper" d="M525 620 Q520 520 563 504 Q598 536 635 504 Q680 526 674 620 Z"/><path class="ink" d="M556 528 Q522 548 514 595 M514 595 Q501 608 487 594 M642 532 Q665 562 665 604"/><path class="ink" d="M487 594 Q479 574 486 552 Q493 536 506 524"/><path class="thin" d="M552 405 q12-18 24 0 q11-22 24 0 q12-19 25 0"/></g><path class="ink" d="M315 640 H875"/><path class="ink" d="M345 640 V705 M845 640 V705"/><g transform="translate(495 592)"><path class="paper" d="M0 0 Q52-18 103 3 V54 Q53 35 0 53 Z"/><path class="paper" d="M103 3 Q155-18 207 0 V53 Q155 35 103 54 Z"/><line class="thin" x1="103" y1="5" x2="103" y2="54"/><line class="thin" x1="23" y1="19" x2="78" y2="15"/><line class="thin" x1="130" y1="16" x2="183" y2="21"/></g><g transform="translate(398 568)"><path class="paper" d="M0 0 H45 V65 H0 Z"/><path class="ink" d="M45 15 q27 0 25 18 q-2 19-25 17"/></g><g transform=