    <path class="thin" d="M746 724 h57 M746 786 h57"/>
    <path class="thin blue" d="M590 603 l-21-23 M623 592 l-5-30"/>

    <!-- incidents -->
    <text class="txt mid" x="116" y="672">生产事故 → 新题目</text>
    <path class="ink" d="M117 704 q122-25 244 0 l-4 111 q-119 23-236 0Z" fill="#fff"/>
    <path class="ink" d="M132 685 q118-21 235 0 M143 669 q111-17 220 0"/>
    <path class="thin orange" d="M171 733 l19 38 h-38Z" fill="#fff"/>
    <path class="thin" d="M171 744 v13 M171 765 h1"/>
    <path class="thin red" d="M105 723 l-31-12 M103 749 l-36 3 M112 697 l-22-25"/>
    <path class="thin green" stroke-dasharray="13 11" d="M365 761 q115 52 217 7 M836 750 q137 46 267-2"/>
    <path class="thin green" d="M567 756 l-24-4 l12 22 M1091 736 l24 4 l-13-22"/>

    <text class="txt small green" x="453" y="826">每次失败都留下证据</text>
    <text class="txt small blue" x="906" y="826">配置变化也要跑回归</text>
  </g>
</svg>