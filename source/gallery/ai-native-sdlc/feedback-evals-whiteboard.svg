<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">会自检的 Agent 更可靠</title>
  <desc id="desc">白板手绘风格。厨师执行、观察、修正，检查员复查，生产事故进入错题本并成为新的评测题目。</desc>
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" seed="17" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter>
    <style>
      .ink{fill:none;stroke:#171717;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .txt{font-family:"Comic Sans MS","Marker Felt","PingFang SC","Microsoft YaHei",sans-serif;fill:#171717;font-weight:700}.small{font-size:28px}.mid{font-size:40px}.big{font-size:60px}
      .blue{fill:#2563eb}.green{fill:#16a34a}.orange{fill:#f97316}.red{fill:#dc2626}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <g filter="url(#rough)">
    <path class="ink" d="M365 26 Q800 5 1240 26 L1232 143 Q805 158 374 143Z" fill="#fff"/>
    <path class="thin orange" d="M413 65 l11 22 l25 4 l-18 17 l4 24 l-22-12 l-22 12 l4-24 l-18-17 l25-4Z" fill="#facc15"/>
