<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .ink{fill:none;stroke:#222;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#333;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.blue{fill:none;stroke:#1469d8;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.green{fill:none;stroke:#158650;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.orange{fill:none;stroke:#f07b20;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.txt{font-family:KaiTi,STKaiti,'Noto Sans SC',sans-serif;fill:#222}.note{font-size:31px}.big{font-size:64px;font-weight:700}.mid{font-size:42px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fbfaf6"/>
  <g opacity=".12"><path d="M45 100 C290 70 490 112 710 83 S1180 82 1545 105" class="thin"/><path d="M60 760 C350 725 620 778 890 742 S1320 730 1540 755" class="thin"/></g>
